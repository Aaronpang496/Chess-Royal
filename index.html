<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DuoBoard — Chess &amp; Go</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171a20; --panel2:#21262e; --line:#262b33;
    --text:#e8ecf1; --muted:#8b95a5; --accent:#7cc36a;
    --best:#7cc36a; --good:#7cc36a; --inacc:#e6b455; --mist:#e08a3c; --blund:#e05c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1400px 900px at 15% -15%,#1e2530 0%,#0f1217 55%,#08090c 100%);
    color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    height:100vh; overflow:hidden;
  }

  /* ---------- Screens ---------- */
  .screen{display:none;position:fixed;inset:0;}
  .screen.active{display:flex;}

  /* Home / Setup shared look */
  #screen-home, #screen-setup{
    flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:26px;
  }
  .hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .hero-logo{
    width:96px;height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;
    font-size:52px;background:linear-gradient(145deg,#2a3340,#181d25);
    box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero-title{font-size:36px;font-weight:900;letter-spacing:-1px;margin:0;}
  .hero-title .accent{color:var(--accent);}
  .hero-sub{color:var(--muted);font-size:15px;max-width:420px;line-height:1.5;margin:0;}
  .btn-primary{
    border:0;background:var(--accent);color:#0c1014;font:inherit;font-weight:800;font-size:16px;
    padding:15px 40px;border-radius:14px;cursor:pointer;transition:.18s;letter-spacing:.2px;
    box-shadow:0 12px 26px rgba(124,195,106,.32);
  }
  .btn-primary:hover{background:#8ed47b;transform:translateY(-2px);box-shadow:0 16px 32px rgba(124,195,106,.42);}
  .btn-primary:active{transform:translateY(0);}
  .btn-secondary{
    border:1px solid #2e3540;background:transparent;color:#c3ccd8;font:inherit;font-weight:700;
    font-size:14px;padding:11px 22px;border-radius:11px;cursor:pointer;transition:.15s;
  }
  .btn-secondary:hover{background:#1d222a;border-color:#3d4654;}

  /* Setup screen */
  .setup-card{
    width:min(460px,100%);background:linear-gradient(180deg,#1c2129,#151920);
    border:1px solid #2a303a;border-radius:22px;padding:28px;
    box-shadow:0 30px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:22px;
  }
  .setup-title{font-size:20px;font-weight:800;letter-spacing:-.2px;margin:0 0 2px;}
  .setup-group{display:flex;flex-direction:column;gap:10px;}
  .setup-label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800;}
  .chip-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .chip-row.three{grid-template-columns:1fr 1fr 1fr;}
  .chip{
    border:1px solid #2e3540;background:#1a1f27;color:#c3ccd8;font:inherit;font-weight:700;
    font-size:14px;padding:14px 10px;border-radius:12px;cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .chip:hover{border-color:#3d4654;background:#21262e;color:#fff;}
  .chip.active{background:#2b3742;border-color:var(--accent);color:#fff;
               box-shadow:0 0 0 1px var(--accent), 0 6px 18px rgba(124,195,106,.18);}
  .setup-actions{display:flex;gap:10px;margin-top:6px;}
  .setup-actions .btn-primary{flex:1;padding:14px;}
  .setup-actions .btn-secondary{padding:14px 22px;}

  /* ---------- Game screen ---------- */
  #screen-game{flex-direction:column;}
  header{
    display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
    border-bottom:1px solid var(--line);background:rgba(20,24,30,.72);
    backdrop-filter:blur(8px);flex-shrink:0;gap:12px;flex-wrap:wrap;
  }
  .head-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .icon-btn{
    border:1px solid #2e3540;background:#1a1f27;color:#c3ccd8;font:inherit;font-weight:700;
    font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{background:#21262e;color:#fff;}
  .badge-group{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{
    font-size:12px;font-weight:800;letter-spacing:.3px;padding:6px 12px;border-radius:8px;
    background:#1f2630;color:#c3ccd8;border:1px solid #2e3540;text-transform:capitalize;
  }
  .badge.accent{background:rgba(124,195,106,.14);color:var(--accent);border-color:rgba(124,195,106,.35);}

  main{flex:1;display:flex;min-height:0;}
  #board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-width:0;min-height:0;}
  #board{border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);
         touch-action:none;cursor:pointer;display:block;}

  aside{
    width:344px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;padding:16px;gap:12px;overflow:hidden;
  }
  .turn-row{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;}
  .turn-dot{width:15px;height:15px;border-radius:50%;background:#fff;
            box-shadow:0 0 0 1.5px #555,inset 0 -2px 3px rgba(0,0,0,.35);transition:.2s;flex-shrink:0;}
  .turn-dot.black{background:#181818;box-shadow:0 0 0 1.5px #555,inset 0 2px 3px rgba(255,255,255,.18);}
  .turn-dot.thinking{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .moves-header{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);
                font-weight:800;padding:2px 2px 0;}
  .moves{flex:1;overflow-y:auto;min-height:60px;border-radius:11px;background:#13161b;
         border:1px solid var(--line);padding:5px;}
  .moves::-webkit-scrollbar{width:8px;}
  .moves::-webkit-scrollbar-thumb{background:#2c333d;border-radius:4px;}
  .move-row{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:7px;font-size:13.5px;}
  .mv-idx{color:#5a6474;font-size:11.5px;width:26px;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .mv-san{font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace;flex:1;}
  .mv-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .empty-note{color:#4d5663;font-size:12.5px;padding:10px;text-align:center;}

  .controls{display:flex;gap:9px;flex-shrink:0;}
  .controls button{flex:1;border:1px solid #2e3540;background:#1d222a;color:#d7dee7;font:inherit;
    font-weight:700;font-size:13px;padding:11px 6px;border-radius:10px;cursor:pointer;transition:.15s;}
  .controls button:hover{background:#262d38;border-color:#3d4654;}
  .controls button.hidden{display:none;}

  /* ---------- Promotion ---------- */
  .promo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         background:rgba(0,0,0,.62);z-index:60;backdrop-filter:blur(3px);}
  .promo.hidden{display:none;}
  .promo-box{background:#1d222a;border:1px solid #333b47;border-radius:16px;padding:18px 22px;
             text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.7);}
  .promo-title{font-weight:800;margin-bottom:12px;font-size:14px;color:#c3ccd8;}
  .promo-options{display:flex;gap:8px;}
  .promo-options button{
    width:64px;height:64px;border-radius:12px;border:1px solid #333b47;background:#252b34;
    color:#fff;cursor:pointer;transition:.15s;font-size:36px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .promo-options button:hover{background:var(--accent);color:#0c1014;border-color:var(--accent);transform:translateY(-2px);}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         background:rgba(6,8,11,.74);z-index:70;backdrop-filter:blur(6px);padding:18px;animation:fade .25s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal.hidden{display:none;}
  .modal-card{
    width:min(520px,100%);max-height:88vh;overflow-y:auto;
    background:linear-gradient(180deg,#1c2129,#151920);border:1px solid #2f3743;
    border-radius:20px;padding:26px;box-shadow:0 40px 90px rgba(0,0,0,.8);
    animation:rise .32s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;gap:15px;align-items:center;margin-bottom:20px;}
  .modal-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:28px;background:#252c36;flex-shrink:0;}
  .modal-icon.win{background:linear-gradient(135deg,#2f4a2b,#243a22);}
  .modal-icon.lose{background:linear-gradient(135deg,#4a2b2b,#3a2222);}
  .modal-icon.draw{background:linear-gradient(135deg,#3a3f4a,#2a2f38);}
  .modal-title{font-size:21px;font-weight:800;letter-spacing:-.2px;}
  .modal-sub{font-size:13.5px;color:var(--muted);margin-top:3px;}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;}
  .stat-label{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:800;}
  .stat-value{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
  .qbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#0e1116;gap:2px;}
  .qbar div{transition:.4s;}
  .qlegend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .qlegend div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#b9c3d0;font-weight:600;}
  .qlegend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .stat-grid > div{background:#1a1f27;border:1px solid #262d38;border-radius:11px;padding:11px 13px;}
  .stat-grid span{display:block;font-size:11px;letter-spacing:.9px;text-transform:uppercase;
                  color:var(--muted);font-weight:800;margin-bottom:5px;}
  .stat-grid b{font-size:14px;font-weight:700;color:#e8ecf1;}
  .note{margin-top:12px;padding:11px 14px;background:#1a1f27;border-radius:11px;
        border-left:3px solid #3a4250;font-size:13px;color:#c3ccd8;line-height:1.5;}
  .note b{color:#fff;}
  .modal-foot{display:flex;gap:10px;margin-top:22px;}
  .modal-foot button{flex:1;border:1px solid #2e3540;background:#1d222a;color:#d7dee7;font:inherit;
    font-weight:700;font-size:13.5px;padding:13px;border-radius:11px;cursor:pointer;transition:.15s;}
  .modal-foot button:hover{background:#262d38;}
  .modal-foot button.primary{background:var(--accent);border-color:var(--accent);color:#0c1014;}
  .modal-foot button.primary:hover{background:#8ed47b;}

  @media (max-width:880px){
    main{flex-direction:column;}
    aside{width:auto;height:44%;border-left:none;border-top:1px solid var(--line);padding:12px;gap:9px;}
    #board-wrap{padding:10px;}
    .hero-title{font-size:28px;}
    .modal-card{padding:20px;}
  }
</style>
</head>
<body>

<!-- ============================================================ HOME -->
<div id="screen-home" class="screen active">
  <div class="hero">
    <div class="hero-logo">♟</div>
    <h1 class="hero-title">Duo<span class="accent">Board</span></h1>
    <p class="hero-sub">A professional chess and Go trainer with three AI difficulty levels and a full post-game recap of every move you played.</p>
  </div>
  <button class="btn-primary" id="home-play">Play</button>
</div>

<!-- ============================================================ SETUP -->
<div id="screen-setup" class="screen">
  <div class="setup-card">
    <h2 class="setup-title">New game</h2>

    <div class="setup-group">
      <div class="setup-label">Choose your game</div>
      <div class="chip-row">
        <button class="chip active" data-mode="chess">♟ Chess</button>
        <button class="chip" data-mode="go">⚫ Go (9×9)</button>
      </div>
    </div>

    <div class="setup-group">
      <div class="setup-label">Opponent difficulty</div>
      <div class="chip-row three">
        <button class="chip" data-diff="1">Easy</button>
        <button class="chip active" data-diff="2">Medium</button>
        <button class="chip" data-diff="3">Hard</button>
      </div>
    </div>

    <div class="setup-actions">
      <button class="btn-secondary" id="setup-back">Back</button>
      <button class="btn-primary" id="setup-start">Start game</button>
    </div>
  </div>
</div>

<!-- ============================================================ GAME -->
<div id="screen-game" class="screen">
  <header>
    <div class="head-left">
      <button class="icon-btn" id="game-menu">← Menu</button>
      <div class="badge-group">
        <span class="badge accent" id="badge-mode">Chess</span>
        <span class="badge" id="badge-diff">Medium</span>
      </div>
    </div>
    <button class="icon-btn" id="game-new">New game</button>
  </header>

  <main>
    <div id="board-wrap"><canvas id="board"></canvas></div>
    <aside>
      <div class="turn-row">
        <div class="turn-dot" id="turn-dot"></div>
        <div id="turn-text">White to move</div>
      </div>
      <div class="moves-header">Move history</div>
      <div class="moves" id="moves"><div class="empty-note">No moves yet</div></div>
      <div class="controls">
        <button id="undo">↶ Undo</button>
        <button id="pass" class="hidden">Pass</button>
        <button id="reset">⟳ Restart</button>
      </div>
    </aside>
  </main>
</div>

<!-- ============================================================ OVERLAYS -->
<div class="promo hidden" id="promo">
  <div class="promo-box">
    <div class="promo-title">Promote your pawn to…</div>
    <div class="promo-options" id="promo-options"></div>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-icon" id="modal-icon">♟</div>
      <div>
        <div class="modal-title" id="modal-title">Game over</div>
        <div class="modal-sub" id="modal-sub"></div>
      </div>
    </div>
    <div id="modal-body"></div>
    <div class="modal-foot">
      <button id="modal-menu">Change settings</button>
      <button id="modal-again" class="primary">Play again</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.2/chess.js"></script>
<script>
"use strict";

/* ==========================================================================
   0.  UTILITIES
   ========================================================================== */
const $ = id => document.getElementById(id);
const inCheck     = g => g.in_check     ? g.in_check()     : g.inCheck();
const inCheckmate = g => g.in_checkmate ? g.in_checkmate() : g.isCheckmate();
const inDraw      = g => g.in_draw      ? g.in_draw()      : g.isDraw();

/* ==========================================================================
   1.  CANVAS
   ========================================================================== */
const canvas = $('board');
const ctx = canvas.getContext('2d');
let S = 0;

function resize(){
  const wrap = $('board-wrap');
  if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;   // hidden
  const size = Math.max(180, Math.floor(Math.min(r.width, r.height)));
  const dpr = window.devicePixelRatio || 1;
  S = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width  = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}

/* ==========================================================================
   2.  GLOBAL STATE
   ========================================================================== */
const G = {
  screen: 'home',
  mode: 'chess',
  difficulty: 2,
  busy: false,
  gen: 0,
  over: false
};

const state = {
  chess: null,
  selected: null,
  targets: [],
  lastMove: null,
  drag: null,
  chessLog: [],
  pendingPromo: null,

  go: null,
  goKo: -1,
  goPasses: 0,
  goLog: [],
  goCapB: 0,
  goCapW: 0,
  goHover: null,
  goLast: null
};

const FILES = 'abcdefgh';
const PIECE_VAL = { p:100, n:320, b:330, r:500, q:900, k:20000 };
const KIND_COLOR = { best:'#7cc36a', good:'#7cc36a', inaccuracy:'#e6b455',
                     mistake:'#e08a3c', blunder:'#e05c5c' };
const KIND_LABEL = { best:'Best', good:'Good', inaccuracy:'Inaccuracy',
                     mistake:'Mistake', blunder:'Blunder' };

const G_HUMAN_CHESS = 'w';
const G_HUMAN_GO = 1;   // human plays Black

/* ==========================================================================
   3.  PIECE VECTOR ART
   ========================================================================== */
const PIECE_SVG = {
  p: ["M22.5,6.4 A5.6,5.6 0 1,0 22.51,6.4 Z",
      "M18.4,17.2 C18.4,21.6 20.1,24.8 19.4,28.8 L25.6,28.8 C24.9,24.8 26.6,21.6 26.6,17.2 Z",
      "M14.6,37 C14.2,33.4 15.4,30.6 17.6,29.2 L27.4,29.2 C29.6,30.6 30.8,33.4 30.4,37 Z"],
  r: ["M12,9.5 L12,16 L16.6,16 L16.6,12.6 L20.4,12.6 L20.4,16 L24.6,16 L24.6,12.6 L28.4,12.6 L28.4,16 L33,16 L33,9.5 Z",
      "M15.2,16 L29.8,16 L28.6,28.5 L16.4,28.5 Z",
      "M14.8,28.5 L30.2,28.5 L30.7,31.8 L14.3,31.8 Z",
      "M13,37 C12.8,33.6 14,31.8 16.2,31.8 L28.8,31.8 C31,31.8 32.2,33.6 32,37 Z"],
  n: ["M19,7 L21.6,9.4 C25.4,8.4 29.2,11.2 30,15.4 C30.8,19.6 30.6,24 30.6,31.2 L15.6,31.2 L17,23.4 C15.8,22.4 14.4,20.8 14.4,18.6 C14.4,16.8 15.4,15.4 16.8,14.6 C16.2,11.8 17.2,8.8 19,7 Z",
      "M12.8,37 C12.6,33.4 13.8,31.2 16,31.2 L29.2,31.2 C31.4,31.2 32.6,33.4 32.4,37 Z"],
  b: ["M22.5,6.2 A2.4,2.4 0 1,0 22.51,6.2 Z",
      "M22.5,9.6 C17.8,12.4 15.2,17.2 16.4,21.2 C17.4,24.4 19.8,26.2 22.5,26.2 C25.2,26.2 27.6,24.4 28.6,21.2 C29.8,17.2 27.2,12.4 22.5,9.6 Z",
      "M17,26.2 L28,26.2 L29,29.6 L16,29.6 Z",
      "M13,37 C12.8,33.6 14,30.4 16.4,29.6 L28.6,29.6 C31,30.4 32.2,33.6 32,37 Z"],
  q: ["M9.5,18.6 L12.8,10.4 L17.2,16.4 L22.5,8.8 L27.8,16.4 L32.2,10.4 L35.5,18.6 Z",
      "M12.8,9.2 A2,2 0 1,0 12.81,9.2 Z",
      "M22.5,7.6 A2.2,2.2 0 1,0 22.51,7.6 Z",
      "M32.2,9.2 A2,2 0 1,0 32.21,9.2 Z",
      "M9.5,17.4 A1.8,1.8 0 1,0 9.51,17.4 Z",
      "M35.5,17.4 A1.8,1.8 0 1,0 35.51,17.4 Z",
      "M11.6,18.6 L33.4,18.6 L32.2,22.4 L12.8,22.4 Z",
      "M12.8,22.4 L32.2,22.4 C31.4,26.4 31,29 31,31.4 L14,31.4 C14,29 13.6,26.4 12.8,22.4 Z",
      "M12,37 C11.8,33.8 13.2,31.4 15.6,31.4 L29.4,31.4 C31.8,31.4 33.2,33.8 33,37 Z"],
  k: ["M20.6,4.6 L24.4,4.6 L24.4,8.2 L28,8.2 L28,12 L24.4,12 L24.4,15.6 L20.6,15.6 L20.6,12 L17,12 L17,8.2 L20.6,8.2 Z",
      "M11.4,19.6 C11.4,16 15.6,13.8 22.5,13.8 C29.4,13.8 33.6,16 33.6,19.6 C33.6,23 31.4,26.4 31.4,29.6 L13.6,29.6 C13.6,26.4 11.4,23 11.4,19.6 Z",
      "M13.6,29.6 L31.4,29.6 L31,31.6 L14,31.6 Z",
      "M12,37 C11.8,33.6 13.4,31.6 15.8,31.6 L29.2,31.6 C31.6,31.6 33.2,33.6 33,37 Z"]
};

const PIECE_PATHS = {};
for (const type in PIECE_SVG){
  const p = new Path2D();
  for (const d of PIECE_SVG[type]) p.addPath(new Path2D(d));
  PIECE_PATHS[type] = p;
}
const PIECE_EYES = { n: { cx:18.2, cy:15.2, r:0.95 } };

function drawPieceOn(c, piece, cx, cy, size, alpha){
  const isWhite = piece.color === 'w';
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.translate(cx - size/2, cy - size/2);
  c.scale(size/45, size/45);

  const grad = c.createLinearGradient(0, 4, 0, 40);
  if (isWhite){
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.55, '#f2efe8'); grad.addColorStop(1, '#c9c2b4');
  } else {
    grad.addColorStop(0, '#5f5f5f'); grad.addColorStop(0.5, '#2b2b2b'); grad.addColorStop(1, '#0b0b0b');
  }
  const path = PIECE_PATHS[piece.type];

  c.save();
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 3.2; c.shadowOffsetY = 1.6;
  c.fillStyle = grad; c.fill(path);
  c.restore();

  c.fillStyle = grad; c.fill(path);
  c.strokeStyle = isWhite ? '#38352f' : '#000';
  c.lineWidth = 1.15; c.lineJoin = 'round';
  c.stroke(path);

  const eye = PIECE_EYES[piece.type];
  if (eye){
    c.beginPath(); c.arc(eye.cx, eye.cy, eye.r, 0, Math.PI * 2);
    c.fillStyle = isWhite ? '#38352f' : '#000'; c.fill();
  }
  c.restore();
}
function drawPiece(piece, cx, cy, size, alpha){
  drawPieceOn(ctx, piece, cx, cy, size, alpha);
}

/* ==========================================================================
   4.  CHESS ENGINE
   ========================================================================== */
const PST = {
  p:[ 0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10,
      5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5,
      5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
  n:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30,
     -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30,
     -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10,
     -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10,
     -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r:[ 0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10,
     -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10,
     -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k:[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
     -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
     -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10,
      20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
};

function evaluateWhite(game){
  const board = game.board();
  let score = 0;
  for (let r = 0; r < 8; r++){
    const row = board[r];
    for (let f = 0; f < 8; f++){
      const pc = row[f];
      if (!pc) continue;
      const idx = pc.color === 'w' ? r * 8 + f : (7 - r) * 8 + f;
      const v = PIECE_VAL[pc.type] + (PST[pc.type] ? PST[pc.type][idx] : 0);
      score += pc.color === 'w' ? v : -v;
    }
  }
  return score;
}

const TIMEOUT = { timeout: true };
let nodes = 0;

function verboseMoves(game){ return game.moves({ verbose: true }); }

function moveScore(m){
  let s = 0;
  if (m.captured) s += 10 * (PIECE_VAL[m.captured] || 0) - (PIECE_VAL[m.piece] || 0);
  if (m.promotion) s += PIECE_VAL[m.promotion] || 0;
  return s;
}
function orderedMoves(game){
  const ms = verboseMoves(game);
  ms.sort((a,b) => moveScore(b) - moveScore(a));
  return ms;
}

function playVerbose(game, m){
  return game.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
}

function quiesce(game, alpha, beta, deadline, qd){
  if ((++nodes & 1023) === 0 && Date.now() > deadline) throw TIMEOUT;
  const sign = game.turn() === 'w' ? 1 : -1;
  const stand = sign * evaluateWhite(game);
  if (qd <= 0) return stand;
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;

  const inChk = inCheck(game);
  let moves = verboseMoves(game);
  if (!inChk){
    moves = moves.filter(m => m.captured || m.promotion);
    if (!moves.length) return stand;
  }
  moves.sort((a,b) => moveScore(b) - moveScore(a));
  for (const m of moves){
    playVerbose(game, m);
    const s = -quiesce(game, -beta, -alpha, deadline, qd - 1);
    game.undo();
    if (s >= beta) return beta;
    if (s > alpha) alpha = s;
  }
  return alpha;
}

function negamax(game, depth, alpha, beta, deadline){
  if ((++nodes & 1023) === 0 && Date.now() > deadline) throw TIMEOUT;
  if (depth <= 0) return quiesce(game, alpha, beta, deadline, 3);

  const moves = orderedMoves(game);
  if (!moves.length) return inCheck(game) ? -99000 - depth * 100 : 0;

  for (const m of moves){
    playVerbose(game, m);
    const s = -negamax(game, depth - 1, -beta, -alpha, deadline);
    game.undo();
    if (s >= beta) return beta;
    if (s > alpha) alpha = s;
  }
  return alpha;
}

function whiteEval(game, depth, budget){
  const deadline = Date.now() + budget;
  nodes = 0;
  /* search on a probe so that a timeout never corrupts the caller's game */
  const probe = new Chess(game.fen());
  try {
    const s = negamax(probe, depth, -Infinity, Infinity, deadline);
    return probe.turn() === 'w' ? s : -s;
  } catch (e){
    if (e !== TIMEOUT) throw e;
    return evaluateWhite(probe);
  }
}

function chooseChessMove(game, level){
  const moves = verboseMoves(game);
  if (!moves.length) return null;

  if (level === 1 && Math.random() < 0.32){
    return moves[(Math.random() * moves.length) | 0];
  }

  const budget   = level === 1 ? 150 : level === 2 ? 500 : 1500;
  const maxDepth = level === 1 ? 1   : level === 2 ? 2   : 4;
  const deadline = Date.now() + budget;

  /* search on a throwaway clone — the live game is never touched */
  const probe = new Chess(game.fen());

  let best = moves[0];
  let bestScore = -Infinity;

  for (let d = 1; d <= maxDepth; d++){
    let alpha = -Infinity;
    let localBest = null;
    let localScore = -Infinity;
    const ordered = moves.slice().sort((a,b) => moveScore(b) - moveScore(a));
    try {
      for (const m of ordered){
        playVerbose(probe, m);
        const s = -negamax(probe, d - 1, -Infinity, -alpha, deadline);
        probe.undo();
        if (s > localScore){ localScore = s; localBest = m; }
        if (s > alpha) alpha = s;
      }
      best = localBest || best;
      bestScore = localScore;
    } catch (e){
      if (e !== TIMEOUT) throw e;
      break;   // probe may be corrupted — but we discard it; use last depth's best
    }
  }
  return best;
}

/* ==========================================================================
   5.  GO ENGINE (9×9)
   ========================================================================== */
const GO_N = 9;
const GO_SIZE = GO_N * GO_N;
const GO_KOMI = 6.5;

function goNb(i){
  const x = i % GO_N, y = (i / GO_N) | 0;
  const out = [];
  if (x > 0) out.push(i - 1);
  if (x < GO_N - 1) out.push(i + 1);
  if (y > 0) out.push(i - GO_N);
  if (y < GO_N - 1) out.push(i + GO_N);
  return out;
}

function goGroup(board, start){
  const color = board[start];
  const stones = [];
  const libs = new Set();
  const seen = new Uint8Array(GO_SIZE);
  const stack = [start];
  seen[start] = 1;
  while (stack.length){
    const i = stack.pop();
    stones.push(i);
    for (const n of goNb(i)){
      if (board[n] === 0) libs.add(n);
      else if (board[n] === color && !seen[n]){ seen[n] = 1; stack.push(n); }
    }
  }
  return { stones, libs: [...libs] };
}

function goPlay(board, idx, color, koPoint){
  if (board[idx] !== 0) return null;
  if (idx === koPoint) return null;

  const nb = board.slice();
  nb[idx] = color;
  let captured = 0;
  let ko = -1;

  for (const n of goNb(idx)){
    if (nb[n] === 3 - color){
      const g = goGroup(nb, n);
      if (g.libs.length === 0){
        for (const s of g.stones) nb[s] = 0;
        captured += g.stones.length;
        if (g.stones.length === 1) ko = n;
      }
    }
  }

  const mine = goGroup(nb, idx);
  if (mine.libs.length === 0) return null;

  if (!(captured === 1 && mine.stones.length === 1 && mine.libs.length === 1)) ko = -1;

  return { board: nb, captured, ko };
}

function goScore(board){
  let black = 0, white = 0;
  const visited = new Uint8Array(GO_SIZE);

  for (let i = 0; i < GO_SIZE; i++){
    if (board[i] === 1) black++;
    else if (board[i] === 2) white++;
    else if (!visited[i]){
      const region = [];
      const borders = new Set();
      const stack = [i];
      visited[i] = 1;
      while (stack.length){
        const j = stack.pop();
        region.push(j);
        for (const n of goNb(j)){
          if (board[n] === 0 && !visited[n]){ visited[n] = 1; stack.push(n); }
          else if (board[n] !== 0) borders.add(board[n]);
        }
      }
      if (borders.size === 1){
        if (borders.has(1)) black += region.length;
        else white += region.length;
      }
    }
  }
  return { black, white: white + GO_KOMI };
}

function goEvaluate(board, color, capB, capW){
  const seen = new Uint8Array(GO_SIZE);
  let score = 0;
  for (let i = 0; i < GO_SIZE; i++){
    if (board[i] === 0 || seen[i]) continue;
    const g = goGroup(board, i);
    for (const s of g.stones) seen[s] = 1;
    const sign = board[i] === color ? 1 : -1;
    score += sign * g.stones.length;
    if (g.libs.length === 1) score -= sign * 14;
    else if (g.libs.length === 2) score -= sign * 3.5;
    score += sign * Math.min(g.libs.length, 6) * 0.55;
  }
  score += (color === 1 ? capB - capW : capW - capB) * 1.15;
  return score;
}

function goChooseMove(board, color, koPoint, capB, capW, level){
  const moves = [];
  for (let i = 0; i < GO_SIZE; i++){
    const res = goPlay(board, i, color, koPoint);
    if (!res) continue;
    const nbCapB = color === 1 ? capB + res.captured : capB;
    const nbCapW = color === 2 ? capW + res.captured : capW;
    let s = goEvaluate(res.board, color, nbCapB, nbCapW);

    const x = i % GO_N, y = (i / GO_N) | 0;
    const edge = Math.min(x, y, GO_N - 1 - x, GO_N - 1 - y);
    s += edge === 0 ? -2.2 : edge === 1 ? -0.6 : 0.4;

    moves.push({ idx: i, score: s, res });
  }

  const passScore = goEvaluate(board, color, capB, capW) - 1.5;
  if (!moves.length) return { pass: true };

  moves.sort((a, b) => b.score - a.score);

  if (level === 1){
    const pool = moves.slice(0, Math.max(1, Math.ceil(moves.length * 0.55)));
    const pick = pool[(Math.random() * pool.length) | 0];
    return pick.score > passScore ? { idx: pick.idx } : { pass: true };
  }
  if (level === 2){
    return moves[0].score > passScore ? { idx: moves[0].idx } : { pass: true };
  }

  const top = moves.slice(0, 7);
  let best = null, bestVal = -Infinity;
  for (const cand of top){
    const oppMoves = [];
    for (let j = 0; j < GO_SIZE; j++){
      const r2 = goPlay(cand.res.board, j, 3 - color, cand.res.ko);
      if (!r2) continue;
      const cb = color === 1 ? capB + cand.res.captured : capB;
      const cw = color === 2 ? capW + cand.res.captured : capW;
      const b2 = 3 - color === 1 ? cb + r2.captured : cb;
      const w2 = 3 - color === 2 ? cw + r2.captured : cw;
      oppMoves.push(goEvaluate(r2.board, 3 - color, b2, w2));
    }
    oppMoves.sort((a, b) => b - a);
    const oppBest = oppMoves.length ? oppMoves[0] : 0;
    const val = cand.score - oppBest * 0.82;
    if (val > bestVal){ bestVal = val; best = cand; }
  }
  return best && best.score > passScore ? { idx: best.idx } : { pass: true };
}

/* ==========================================================================
   6.  CHESS RENDERING
   ========================================================================== */
function squareCenter(sq){
  const cell = S / 8;
  const f = FILES.indexOf(sq[0]);
  const r = 8 - parseInt(sq[1], 10);
  return { x: (f + 0.5) * cell, y: (r + 0.5) * cell, cell };
}
function squareAtPoint(x, y){
  const cell = S / 8;
  const f = Math.floor(x / cell);
  const r = Math.floor(y / cell);
  if (f < 0 || f > 7 || r < 0 || r > 7) return null;
  return FILES[f] + (8 - r);
}

function renderChess(){
  const cell = S / 8;

  for (let r = 0; r < 8; r++){
    for (let f = 0; f < 8; f++){
      ctx.fillStyle = (r + f) % 2 === 0 ? '#efdec3' : '#b58863';
      ctx.fillRect(f * cell, r * cell, cell + 0.5, cell + 0.5);
    }
  }

  if (state.lastMove){
    ctx.fillStyle = 'rgba(255,213,79,.45)';
    for (const sq of [state.lastMove.from, state.lastMove.to]){
      const { x, y } = squareCenter(sq);
      ctx.fillRect(x - cell / 2, y - cell / 2, cell, cell);
    }
  }

  if (state.selected){
    const { x, y } = squareCenter(state.selected);
    ctx.fillStyle = 'rgba(120,200,120,.45)';
    ctx.fillRect(x - cell / 2, y - cell / 2, cell, cell);
  }

  const game = state.chess;
  if (game && inCheck(game)){
    const turn = game.turn();
    const board = game.board();
    for (let r = 0; r < 8; r++){
      for (let f = 0; f < 8; f++){
        const pc = board[r][f];
        if (pc && pc.type === 'k' && pc.color === turn){
          const cx = (f + 0.5) * cell, cy = (r + 0.5) * cell;
          const g = ctx.createRadialGradient(cx, cy, cell * 0.05, cx, cy, cell * 0.62);
          g.addColorStop(0, 'rgba(230,60,60,.85)');
          g.addColorStop(1, 'rgba(230,60,60,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(cx, cy, cell * 0.62, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  for (const t of state.targets){
    const { x, y } = squareCenter(t.to);
    if (t.captured){
      ctx.beginPath();
      ctx.arc(x, y, cell * 0.40, 0, Math.PI * 2);
      ctx.lineWidth = cell * 0.075;
      ctx.strokeStyle = 'rgba(30,30,30,.32)';
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, cell * 0.145, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(30,30,30,.30)';
      ctx.fill();
    }
  }

  if (state.drag && state.drag.over){
    const { x, y } = squareCenter(state.drag.over);
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = cell * 0.06;
    ctx.strokeRect(x - cell / 2 + 2, y - cell / 2 + 2, cell - 4, cell - 4);
  }

  const board = game.board();
  for (let r = 0; r < 8; r++){
    for (let f = 0; f < 8; f++){
      const pc = board[r][f];
      if (!pc) continue;
      const sq = FILES[f] + (8 - r);
      if (state.drag && state.drag.moved && state.drag.from === sq) continue;
      drawPiece(pc, (f + 0.5) * cell, (r + 0.5) * cell, cell * 0.94);
    }
  }

  if (state.drag && state.drag.moved && state.drag.piece){
    drawPiece(state.drag.piece, state.drag.x, state.drag.y, cell * 1.02, 0.92);
  }

  ctx.font = `600 ${Math.max(9, cell * 0.19)}px ui-sans-serif,system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let f = 0; f < 8; f++){
    ctx.fillStyle = f % 2 === 0 ? '#b58863' : '#efdec3';
    ctx.fillText(FILES[f], (f + 0.5) * cell, S - cell * 0.19);
  }
  for (let r = 0; r < 8; r++){
    ctx.fillStyle = r % 2 === 0 ? '#efdec3' : '#b58863';
    ctx.fillText(String(8 - r), cell * 0.19, (r + 0.5) * cell);
  }
}

/* ==========================================================================
   7.  GO RENDERING
   ========================================================================== */
const STAR_POINTS = [[2,2],[6,2],[4,4],[2,6],[6,6]];

function goGeom(){
  const m = S * 0.072;
  const cell = (S - 2 * m) / (GO_N - 1);
  return { m, cell };
}
function goPointAt(x, y){
  const { m, cell } = goGeom();
  const gx = Math.round((x - m) / cell);
  const gy = Math.round((y - m) / cell);
  if (gx < 0 || gx >= GO_N || gy < 0 || gy >= GO_N) return null;
  const px = m + gx * cell, py = m + gy * cell;
  if (Math.hypot(x - px, y - py) > cell * 0.56) return null;
  return { x: gx, y: gy, idx: gy * GO_N + gx };
}

function drawStone(cx, cy, r, color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.beginPath();
  ctx.arc(cx + r * 0.09, cy + r * 0.16, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();

  const g = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.38, r * 0.12, cx, cy, r * 1.12);
  if (color === 1){
    g.addColorStop(0, '#6a6a6a'); g.addColorStop(0.45, '#2a2a2a'); g.addColorStop(1, '#050505');
  } else {
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#f0efe9'); g.addColorStop(1, '#bfbcb2');
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(0.6, r * 0.045);
  ctx.strokeStyle = color === 1 ? 'rgba(0,0,0,.7)' : 'rgba(120,116,105,.55)';
  ctx.stroke();
  ctx.restore();
}

function renderGo(){
  const board = state.go;
  const { m, cell } = goGeom();

  const wood = ctx.createLinearGradient(0, 0, S, S);
  wood.addColorStop(0, '#e9c184'); wood.addColorStop(0.5, '#e0b271'); wood.addColorStop(1, '#cfa05d');
  ctx.fillStyle = wood; ctx.fillRect(0, 0, S, S);

  ctx.strokeStyle = 'rgba(150,105,50,.14)'; ctx.lineWidth = 1;
  for (let i = 0; i < 26; i++){
    const y = (i / 26) * S + Math.sin(i * 1.7) * 4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(S * 0.35, y + 5, S * 0.65, y - 5, S, y + 2);
    ctx.stroke();
  }

  ctx.strokeStyle = '#4a3418';
  ctx.lineWidth = Math.max(1, S * 0.0018);
  for (let i = 0; i < GO_N; i++){
    const p = m + i * cell;
    ctx.beginPath(); ctx.moveTo(m, p); ctx.lineTo(S - m, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, m); ctx.lineTo(p, S - m); ctx.stroke();
  }
  ctx.lineWidth = Math.max(1.6, S * 0.0034);
  ctx.strokeRect(m, m, S - 2 * m, S - 2 * m);

  ctx.fillStyle = '#4a3418';
  for (const [sx, sy] of STAR_POINTS){
    ctx.beginPath();
    ctx.arc(m + sx * cell, m + sy * cell, Math.max(1.8, cell * 0.075), 0, Math.PI * 2);
    ctx.fill();
  }

  if (!G.busy && !G.over && state.go){
    ctx.fillStyle = 'rgba(70,50,25,.17)';
    for (let i = 0; i < GO_SIZE; i++){
      if (board[i] !== 0) continue;
      const x = i % GO_N, y = (i / GO_N) | 0;
      ctx.beginPath();
      ctx.arc(m + x * cell, m + y * cell, Math.max(1.4, cell * 0.055), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (state.goHover !== null && board[state.goHover] === 0 && !G.busy && !G.over){
    const x = state.goHover % GO_N, y = (state.goHover / GO_N) | 0;
    drawStone(m + x * cell, m + y * cell, cell * 0.47, 1, 0.34);
  }

  for (let i = 0; i < GO_SIZE; i++){
    if (!board[i]) continue;
    const x = i % GO_N, y = (i / GO_N) | 0;
    drawStone(m + x * cell, m + y * cell, cell * 0.47, board[i]);
  }

  if (state.goLast !== null && board[state.goLast]){
    const x = state.goLast % GO_N, y = (state.goLast / GO_N) | 0;
    ctx.beginPath();
    ctx.arc(m + x * cell, m + y * cell, cell * 0.13, 0, Math.PI * 2);
    ctx.fillStyle = board[state.goLast] === 1 ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.75)';
    ctx.fill();
  }

  ctx.font = `600 ${Math.max(8, cell * 0.30)}px ui-sans-serif,system-ui,sans-serif`;
  ctx.fillStyle = 'rgba(70,48,20,.55)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < GO_N; i++){
    ctx.fillText(FILES[i].toUpperCase(), m + i * cell, S - m * 0.45);
    ctx.fillText(String(GO_N - i), m * 0.45, m + i * cell);
  }
}

/* ==========================================================================
   8.  RENDER DISPATCH
   ========================================================================== */
function render(){
  if (!S) return;
  if (G.mode === 'chess') renderChess();
  else renderGo();
}

/* ==========================================================================
   9.  CHESS GAME FLOW
   ========================================================================== */
function newChessGame(){
  state.chess = new Chess();
  state.selected = null;
  state.targets = [];
  state.lastMove = null;
  state.drag = null;
  state.chessLog = [];
  state.pendingPromo = null;
  G.over = false;
  G.busy = false;
  hideModal();
  syncUI();
  render();
}

function classify(loss){
  if (loss <= 18) return 'best';
  if (loss <= 55) return 'good';
  if (loss <= 130) return 'inaccuracy';
  if (loss <= 320) return 'mistake';
  return 'blunder';
}

function applyChessMove(from, to, promotion){
  const game = state.chess;
  if (!game || game.game_over()) return false;

  const mover = game.turn();
  const e0 = whiteEval(game, 2, 200);

  let mv = null;
  try { mv = game.move({ from, to, promotion: promotion || 'q' }); }
  catch (e) { mv = null; }
  if (!mv) return false;

  const e1 = whiteEval(game, 2, 200);
  const loss = Math.max(0, mover === 'w' ? e0 - e1 : e1 - e0);

  state.chessLog.push({
    san: mv.san, color: mover, loss,
    kind: classify(loss),
    from, to
  });

  state.lastMove = { from, to };
  state.selected = null;
  state.targets = [];
  state.drag = null;

  render();
  syncUI();

  if (game.game_over()){
    G.over = true;
    setTimeout(endChessGame, 400);
    return true;
  }

  /* schedule AI if it's now the AI's turn */
  if (game.turn() !== G_HUMAN_CHESS){
    scheduleChessAI();
  }
  return true;
}

function scheduleChessAI(){
  if (G.over || !state.chess || state.chess.game_over()) return;
  const gen = G.gen;
  G.busy = true;
  syncUI();

  setTimeout(() => {
    if (gen !== G.gen) return;
    let mv = null;
    try {
      mv = chooseChessMove(state.chess, G.difficulty);
    } catch (e){
      console.error('AI error:', e);
    }
    G.busy = false;
    if (gen !== G.gen) return;

    if (mv) applyChessMove(mv.from, mv.to, mv.promotion);
    else syncUI();
  }, 180);
}

function undoChess(){
  if (G.busy || !state.chess || !state.chess.history().length) return;
  state.chess.undo();
  state.chessLog.pop();

  if (state.chess.turn() !== G_HUMAN_CHESS && state.chess.history().length){
    state.chess.undo();
    state.chessLog.pop();
  }

  const hist = state.chess.history({ verbose: true });
  state.lastMove = hist.length
    ? { from: hist[hist.length - 1].from, to: hist[hist.length - 1].to }
    : null;
  state.selected = null;
  state.targets = [];
  G.over = false;
  hideModal();
  render();
  syncUI();
}

function endChessGame(){
  const game = state.chess;
  if (!game) return;

  let title = 'Game over', sub = '', iconCls = 'draw', icon = '½';

  if (inCheckmate(game)){
    const loser = game.turn();
    const winner = loser === 'w' ? 'Black' : 'White';
    title = 'Checkmate';
    sub = winner + ' wins';
    const humanWon = (loser === 'b');
    iconCls = humanWon ? 'win' : 'lose';
    icon = humanWon ? '♔' : '♚';
  } else if (inDraw(game)){
    title = 'Draw';
    sub = (game.in_stalemate && game.in_stalemate()) ? 'Stalemate' :
          (game.insufficient_material && game.insufficient_material()) ? 'Insufficient material' :
          (game.in_threefold_repetition && game.in_threefold_repetition()) ? 'Threefold repetition' :
          'Fifty-move rule';
  }

  const mine = state.chessLog.filter(p => p.color === G_HUMAN_CHESS);
  const counts = { best:0, good:0, inaccuracy:0, mistake:0, blunder:0 };
  let totalLoss = 0, bestMove = null, worstMove = null;

  mine.forEach(p => {
    counts[p.kind]++;
    totalLoss += p.loss;
    if (!bestMove || p.loss < bestMove.loss) bestMove = p;
    if (!worstMove || p.loss > worstMove.loss) worstMove = p;
  });

  const avgLoss = mine.length ? totalLoss / mine.length : 0;
  let accuracy = 103.1668 * Math.exp(-0.04354 * avgLoss) - 3.1669;
  accuracy = Math.max(0, Math.min(100, accuracy));

  const bar = ['best','good','inaccuracy','mistake','blunder']
    .map(k => `<div style="flex:${counts[k] || 0.0001};background:${KIND_COLOR[k]}"></div>`)
    .join('');
  const legend = ['best','good','inaccuracy','mistake','blunder']
    .map(k => `<div><i style="background:${KIND_COLOR[k]}"></i>${KIND_LABEL[k]} · ${counts[k]}</div>`)
    .join('');

  const numOf = ply => {
    const idx = state.chessLog.indexOf(ply);
    return (Math.floor(idx / 2) + 1) + (ply.color === 'w' ? '.' : '…');
  };

  const body = `
    <div class="stat-row">
      <div class="stat-label">Your accuracy</div>
      <div class="stat-value">${accuracy.toFixed(1)}%</div>
    </div>
    <div class="qbar">${bar}</div>
    <div class="qlegend">${legend}</div>
    <div class="stat-grid">
      <div><span>Your moves</span><b>${mine.length}</b></div>
      <div><span>Avg. loss</span><b>${(avgLoss / 100).toFixed(2)} pawns</b></div>
      <div><span>Best move</span><b>${bestMove ? numOf(bestMove) + ' ' + bestMove.san : '—'}</b></div>
      <div><span>Biggest miss</span><b>${worstMove ? numOf(worstMove) + ' ' + worstMove.san : '—'}</b></div>
    </div>
    ${worstMove && worstMove.kind === 'blunder'
      ? `<div class="note"><b>${numOf(worstMove)} ${worstMove.san}</b> cost you about ${(worstMove.loss / 100).toFixed(2)} pawns — that was the turning point.</div>`
      : `<div class="note">Solid game — you kept the evaluation stable across your moves.</div>`}
  `;

  showModal({ icon, iconCls, title, sub, body });
}

/* ==========================================================================
   10.  GO GAME FLOW
   ========================================================================== */
function newGoGame(){
  state.go = new Int8Array(GO_SIZE);
  state.goKo = -1;
  state.goPasses = 0;
  state.goLog = [];
  state.goCapB = 0;
  state.goCapW = 0;
  state.goHover = null;
  state.goLast = null;
  G.over = false;
  G.busy = false;
  hideModal();
  syncUI();
  render();
}

function goCoord(idx){
  const x = idx % GO_N, y = (idx / GO_N) | 0;
  return FILES[x].toUpperCase() + (GO_N - y);
}

function applyGoMove(idx, color){
  const res = goPlay(state.go, idx, color, state.goKo);
  if (!res) return false;

  state.go = res.board;
  state.goKo = res.ko;
  state.goLast = idx;
  state.goPasses = 0;
  if (color === 1) state.goCapB += res.captured;
  else state.goCapW += res.captured;

  state.goLog.push({
    san: goCoord(idx),
    color: color === 1 ? 'b' : 'w',
    captured: res.captured
  });

  render();
  syncUI();

  if (color === G_HUMAN_GO && !G.over) scheduleGoAI();
  return true;
}

function applyGoPass(color){
  state.goPasses++;
  state.goKo = -1;
  state.goLog.push({
    san: 'pass',
    color: color === 1 ? 'b' : 'w',
    captured: 0
  });
  render();
  syncUI();

  if (state.goPasses >= 2){
    G.over = true;
    setTimeout(endGoGame, 350);
    return;
  }
  if (color === G_HUMAN_GO) scheduleGoAI();
}

function scheduleGoAI(){
  if (G.over) return;
  const gen = G.gen;
  G.busy = true;
  syncUI();

  setTimeout(() => {
    if (gen !== G.gen) return;
    let mv = null;
    try {
      mv = goChooseMove(state.go, 2, state.goKo, state.goCapB, state.goCapW, G.difficulty);
    } catch (e){
      console.error('Go AI error:', e);
      mv = { pass: true };
    }
    G.busy = false;
    if (gen !== G.gen) return;
    if (mv.pass) applyGoPass(2);
    else applyGoMove(mv.idx, 2);
  }, 180);
}

function undoGo(){
  if (G.busy || !state.goLog.length) return;

  const log = state.goLog.slice();
  log.pop();
  if (log.length && log[log.length - 1].color === 'w') log.pop();

  const rebuilt = { board: new Int8Array(GO_SIZE), ko: -1, last: null,
                    capB: 0, capW: 0, passes: 0 };
  for (const p of log){
    if (p.san === 'pass'){ rebuilt.passes++; rebuilt.ko = -1; continue; }
    const x = FILES.indexOf(p.san[0].toLowerCase());
    const y = GO_N - parseInt(p.san.slice(1), 10);
    const idx = y * GO_N + x;
    const r = goPlay(rebuilt.board, idx, p.color === 'b' ? 1 : 2, rebuilt.ko);
    if (!r) break;
    rebuilt.board = r.board;
    rebuilt.ko = r.ko;
    rebuilt.last = idx;
    rebuilt.passes = 0;
    if (p.color === 'b') rebuilt.capB += r.captured; else rebuilt.capW += r.captured;
  }

  state.go = rebuilt.board;
  state.goKo = rebuilt.ko;
  state.goLast = rebuilt.last;
  state.goCapB = rebuilt.capB;
  state.goCapW = rebuilt.capW;
  state.goPasses = rebuilt.passes;
  state.goLog = log;
  G.over = false;
  hideModal();
  render();
  syncUI();
}

function endGoGame(){
  const sc = goScore(state.go);
  const blackTotal = sc.black + state.goCapB;
  const whiteTotal = sc.white + state.goCapW;
  const humanWon = blackTotal > whiteTotal;
  const diff = Math.abs(blackTotal - whiteTotal).toFixed(1);

  const title = humanWon ? 'You win!' : 'You lose';
  const sub = humanWon
    ? `Black wins by ${diff} points`
    : `White wins by ${diff} points`;

  const body = `
    <div class="stat-row">
      <div class="stat-label">Final score</div>
      <div class="stat-value">${blackTotal.toFixed(1)} — ${whiteTotal.toFixed(1)}</div>
    </div>
    <div class="stat-grid">
      <div><span>Black (you) · territory</span><b>${sc.black}</b></div>
      <div><span>Black captures</span><b>${state.goCapB}</b></div>
      <div><span>White · territory</span><b>${(sc.white - GO_KOMI).toFixed(0)}</b></div>
      <div><span>White captures</span><b>${state.goCapW}</b></div>
    </div>
    <div class="note">
      Komi of <b>${GO_KOMI}</b> added to White. Total moves played: <b>${state.goLog.length}</b>.
    </div>
  `;

  showModal({
    icon: humanWon ? '⚫' : '⚪',
    iconCls: humanWon ? 'win' : 'lose',
    title, sub, body
  });
}

/* ==========================================================================
   11.  MODAL
   ========================================================================== */
function showModal({ icon, iconCls, title, sub, body }){
  $('modal-icon').textContent = icon;
  $('modal-icon').className = 'modal-icon ' + (iconCls || '');
  $('modal-title').textContent = title;
  $('modal-sub').textContent = sub;
  $('modal-body').innerHTML = body;
  $('modal').classList.remove('hidden');
}
function hideModal(){ $('modal').classList.add('hidden'); }

/* ==========================================================================
   12.  SIDEBAR / UI SYNC
   ========================================================================== */
function syncUI(){
  const dot = $('turn-dot');
  const txt = $('turn-text');
  const passBtn = $('pass');

  if (G.mode === 'chess'){
    const game = state.chess;
    if (!game) return;
    const turn = game.turn();
    dot.className = 'turn-dot' + (turn === 'b' ? ' black' : '') + (G.busy ? ' thinking' : '');
    if (G.over) txt.textContent = 'Game over';
    else if (G.busy) txt.textContent = 'AI is thinking…';
    else txt.textContent = turn === 'w' ? 'White to move' : 'Black to move';
    passBtn.classList.add('hidden');
  } else {
    const turn = state.goLog.length
      ? (state.goLog[state.goLog.length - 1].color === 'b' ? 2 : 1)
      : 1;
    dot.className = 'turn-dot' + (turn === 2 ? '' : ' black') + (G.busy ? ' thinking' : '');
    if (G.over) txt.textContent = 'Game over';
    else if (G.busy) txt.textContent = 'AI is thinking…';
    else txt.textContent = turn === 1 ? 'Your move (Black)' : 'White to move';
    passBtn.classList.remove('hidden');
  }
  renderMoveList();
}

function renderMoveList(){
  const box = $('moves');
  const log = G.mode === 'chess' ? state.chessLog : state.goLog;

  if (!log.length){
    box.innerHTML = '<div class="empty-note">No moves yet</div>';
    return;
  }

  let html = '';
  if (G.mode === 'chess'){
    log.forEach((p, i) => {
      const num = Math.floor(i / 2) + 1;
      const label = i % 2 === 0 ? num + '.' : '…';
      html += `<div class="move-row">
        <span class="mv-idx">${label}</span>
        <span class="mv-san">${p.san}</span>
        <span class="mv-dot" style="background:${KIND_COLOR[p.kind] || '#8b95a5'}"></span>
      </div>`;
    });
  } else {
    log.forEach((p, i) => {
      html += `<div class="move-row">
        <span class="mv-idx">${i + 1}</span>
        <span class="mv-san">${p.san}</span>
        <span class="mv-dot" style="background:${p.color === 'b' ? '#111' : '#fff'};box-shadow:0 0 0 1px #555"></span>
      </div>`;
    });
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

/* ==========================================================================
   13.  POINTER INTERACTION
   ========================================================================== */
function canvasPoint(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function selectSquare(sq){
  const game = state.chess;
  const piece = game.get(sq);
  if (!piece || piece.color !== game.turn() || piece.color !== G_HUMAN_CHESS){
    state.selected = null;
    state.targets = [];
    return;
  }
  state.selected = sq;
  state.targets = game.moves({ square: sq, verbose: true });
}

function isPromotionMove(from, to){
  const piece = state.chess.get(from);
  if (!piece || piece.type !== 'p') return false;
  const rank = to[1];
  return (piece.color === 'w' && rank === '8') || (piece.color === 'b' && rank === '1');
}

function attemptChessMove(from, to){
  if (isPromotionMove(from, to)){
    state.pendingPromo = { from, to };
    showPromo();
    return;
  }
  applyChessMove(from, to);
}

canvas.addEventListener('pointerdown', e => {
  if (G.busy || G.over || G.screen !== 'game') return;
  const p = canvasPoint(e);

  if (G.mode === 'chess'){
    const sq = squareAtPoint(p.x, p.y);
    if (!sq || !state.chess || state.chess.game_over()) return;

    if (state.selected && state.targets.some(t => t.to === sq)){
      attemptChessMove(state.selected, sq);
      return;
    }
    const piece = state.chess.get(sq);
    if (piece && piece.color === state.chess.turn() && piece.color === G_HUMAN_CHESS){
      selectSquare(sq);
      state.drag = { from: sq, piece, x: p.x, y: p.y, moved: false, over: null };
      canvas.setPointerCapture(e.pointerId);
      render();
    } else {
      state.selected = null;
      state.targets = [];
      render();
    }
  } else {
    const pt = goPointAt(p.x, p.y);
    if (!pt) return;
    if (state.go[pt.idx] !== 0) return;
    applyGoMove(pt.idx, G_HUMAN_GO);
  }
});

canvas.addEventListener('pointermove', e => {
  if (G.screen !== 'game') return;
  if (G.mode === 'go'){
    const p = canvasPoint(e);
    const pt = goPointAt(p.x, p.y);
    const next = pt ? pt.idx : null;
    if (next !== state.goHover){
      state.goHover = next;
      if (!G.busy) render();
    }
    return;
  }
  if (!state.drag) return;
  const p = canvasPoint(e);
  state.drag.x = p.x;
  state.drag.y = p.y;
  state.drag.moved = true;
  const sq = squareAtPoint(p.x, p.y);
  state.drag.over = sq && state.targets.some(t => t.to === sq) ? sq : null;
  render();
});

canvas.addEventListener('pointerup', e => {
  if (G.screen !== 'game' || G.mode !== 'chess' || !state.drag) return;
  const p = canvasPoint(e);
  const sq = squareAtPoint(p.x, p.y);
  const drag = state.drag;

  if (drag.moved){
    if (sq && state.targets.some(t => t.to === sq)){
      attemptChessMove(drag.from, sq);
    } else {
      state.drag = null;
      state.selected = null;
      state.targets = [];
      render();
    }
  } else {
    state.drag = null;
  }
});

canvas.addEventListener('pointerleave', () => {
  if (state.drag){ state.drag.over = null; render(); }
  if (G.mode === 'go' && state.goHover !== null){ state.goHover = null; render(); }
});

/* ---------- promotion overlay ---------- */
const PROMO_GLYPHS = { q:'♕', r:'♖', b:'♗', n:'♘' };

function showPromo(){
  const opts = $('promo-options');
  opts.innerHTML = '';
  ['q','r','b','n'].forEach(type => {
    const btn = document.createElement('button');
    btn.textContent = PROMO_GLYPHS[type];
    btn.onclick = () => {
      $('promo').classList.add('hidden');
      const pending = state.pendingPromo;
      state.pendingPromo = null;
      if (pending) applyChessMove(pending.from, pending.to, type);
    };
    opts.appendChild(btn);
  });
  $('promo').classList.remove('hidden');
}

/* ==========================================================================
   14.  SCREEN NAVIGATION
   ========================================================================== */
function showScreen(id){
  G.screen = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + id));
  if (id === 'game'){
    requestAnimationFrame(() => { resize(); render(); syncUI(); });
  }
}

function startGame(){
  G.gen++;
  G.busy = false;
  G.over = false;
  hideModal();
  $('badge-mode').textContent = G.mode === 'chess' ? 'Chess' : 'Go 9×9';
  $('badge-diff').textContent = ['', 'Easy', 'Medium', 'Hard'][G.difficulty];
  showScreen('game');
  requestAnimationFrame(() => {
    resize();
    if (G.mode === 'chess') newChessGame();
    else newGoGame();
  });
}

function goToSetup(){
  G.gen++;
  G.busy = false;
  G.over = false;
  hideModal();
  showScreen('setup');
}

/* ---------- wire UI ---------- */
$('home-play').addEventListener('click', () => showScreen('setup'));
$('setup-back').addEventListener('click', () => showScreen('home'));
$('setup-start').addEventListener('click', startGame);
$('game-menu').addEventListener('click', goToSetup);
$('game-new').addEventListener('click', startGame);
$('modal-menu').addEventListener('click', goToSetup);
$('modal-again').addEventListener('click', startGame);

document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    G.mode = btn.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
  });
});
document.querySelectorAll('[data-diff]').forEach(btn => {
  btn.addEventListener('click', () => {
    G.difficulty = parseInt(btn.dataset.diff, 10);
    document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('active', b === btn));
  });
});

$('undo').addEventListener('click', () => {
  if (G.busy) return;
  if (G.mode === 'chess') undoChess();
  else undoGo();
});

$('reset').addEventListener('click', () => {
  G.gen++;
  G.busy = false;
  G.over = false;
  hideModal();
  if (G.mode === 'chess') newChessGame();
  else newGoGame();
});

$('pass').addEventListener('click', () => {
  if (G.mode !== 'go' || G.busy || G.over) return;
  applyGoPass(G_HUMAN_GO);
});

window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('board-wrap'));

/* ==========================================================================
   15.  BOOT
   ========================================================================== */
function boot(){
  showScreen('home');
  $('screen-home').classList.add('active');
}

if (typeof Chess === 'undefined'){
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/chess.js@0.10.2/chess.js';
  s.onload = boot;
  s.onerror = () => {
    document.body.innerHTML =
      '<div style="padding:40px;font:16px system-ui;color:#eee">⚠️ Could not load chess.js — check your internet connection and reload.</div>';
  };
  document.head.appendChild(s);
} else {
  boot();
}
</script>
</body>
